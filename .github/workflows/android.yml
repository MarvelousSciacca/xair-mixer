# Compila l'app Android (APK) a ogni modifica e la pubblica nella pagina "Releases".
name: App Android

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Interfaccia web nel progetto Android
        run: |
          npm ci
          cp node_modules/@capacitor/core/dist/index.js public/vendor/capacitor-core.js
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.XAIR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xair-mixer.keystore"
            echo "XAIR_KEYSTORE=$RUNNER_TEMP/xair-mixer.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Segreto XAIR_KEYSTORE_BASE64 mancante: APK firmato con chiave di debug"
          fi

      - name: Compilazione
        working-directory: android
        env:
          XAIR_KEYSTORE_PASSWORD: ${{ secrets.XAIR_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/AirDesk.apk"

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: AirDesk-android
          path: ${{ runner.temp }}/AirDesk.apk

      - name: Pubblicazione
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" "$RUNNER_TEMP/AirDesk.apk" \
            --title "AirDesk per Android 1.0.${{ github.run_number }}" \
            --notes "Scarica AirDesk.apk sul telefono o tablet Android e aprilo per installarlo." \
            --latest
